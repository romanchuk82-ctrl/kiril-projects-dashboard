name: Publish Border History Read Model

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: border-history-model-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: border-history-data
          fetch-depth: 0

      - name: Fetch validated read model
        shell: bash
        run: |
          set -euo pipefail
          url="https://border-monitor-history-app.onrender.com/api/export"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --connect-timeout 20 --max-time 120 "$url?attempt=$attempt" -o history-model.next.json; then
              if jq -e '.generatedAt and (.catalog|type=="array") and (.datasets|type=="object")' history-model.next.json >/dev/null; then
                ok=1
                break
              fi
            fi
            sleep 20
          done
          test "$ok" = "1"
          mv history-model.next.json history-model.json

      - name: Commit only when model changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- history-model.json; then
            echo "Read model unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history-model.json
          git commit -m "Update Border History read model"
          git push origin HEAD:border-history-data
