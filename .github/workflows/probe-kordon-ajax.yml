name: Probe Kordon queue endpoint

on:
  push:
    branches: [border-monitor]
    paths:
      - .github/workflows/probe-kordon-ajax.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - name: Inspect scripts
        run: |
          set -euo pipefail
          curl -LfsS --max-time 30 -A 'Mozilla/5.0' 'https://kordon.info/?_bm='$(date +%s) -o /tmp/kordon.html
          python - <<'PY'
          from pathlib import Path
          import re, html
          s=Path('/tmp/kordon.html').read_text(errors='ignore')
          needles=['admin-ajax.php','ajaxurl','action:',"action'",'fetch(','queue','border','checkpoint','crossing','kordon_']
          for needle in needles:
              print('\n###',needle)
              pos=0;n=0
              while n<15:
                  i=s.lower().find(needle.lower(),pos)
                  if i<0: break
                  chunk=html.unescape(s[max(0,i-260):i+500]).replace('\n',' ')
                  print(re.sub(r'\s+',' ',chunk)[:900])
                  pos=i+len(needle);n+=1
          print('\n### ACTION TOKENS')
          for x in sorted(set(re.findall(r"(?:action|ajax_action)[\"']?\s*[:=]\s*[\"']([A-Za-z0-9_-]+)",s,re.I))): print(x)
          print('\n### SCRIPT SRCS')
          for x in re.findall(r'<script[^>]+src=["\']([^"\']+)',s,re.I): print(html.unescape(x))
          PY
      - name: Remove probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/probe-kordon-ajax.yml
          git commit -m "Remove Kordon ajax probe"
          git push origin HEAD:border-monitor
