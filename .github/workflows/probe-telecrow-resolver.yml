name: Probe TeleCrow resolver
on:
  push:
    branches: [border-monitor]
    paths: ['.github/workflows/probe-telecrow-resolver.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public resolver JS
        shell: python
        run: |
          import re, urllib.request
          url='https://telecrow.com/assets/ToolUsernameToId-811ac531.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          print('--- endpoints ---')
          vals=[]
          vals += re.findall(r'https?://[^\"\'\s]+', text)
          vals += re.findall(r'/api/[A-Za-z0-9_/?=&.${}-]+', text)
          for v in dict.fromkeys(vals): print(v)
          print('--- context ---')
          for part in re.split(r';',text):
              if re.search(r'axios|fetch|username|lookup|resolve|/api/',part,re.I):
                  print(part[:1200])
