name: Probe TeleCrow resolver
on:
  push:
    branches: [border-monitor]
    paths: ['.github/workflows/probe-telecrow-resolver.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public resolver JS
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://telecrow.com/assets/ToolUsernameToId-811ac531.js' -o /tmp/tool.js
          echo '--- endpoints ---'
          grep -Eo 'https?://[^"'"' ]+|/api/[A-Za-z0-9_/?=&.${}-]+' /tmp/tool.js | head -100 || true
          echo '--- context ---'
          sed 's/;/;\n/g' /tmp/tool.js | grep -nE 'axios|fetch|username|lookup|resolve|/api/' | head -120 || true
