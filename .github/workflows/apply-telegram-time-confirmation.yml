name: Apply Telegram time confirmation
on:
  push:
    branches: [border-monitor]
    paths: ['.github/workflows/apply-telegram-time-confirmation.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - name: Fix patch replacement escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch_telegram_time_support_v2.py')
          s=p.read_text()
          s=s.replace(",new_backend,s,flags=re.S)",",lambda _m:new_backend,s,flags=re.S)")
          s=s.replace(",new_front,s,flags=re.S)",",lambda _m:new_front,s,flags=re.S)")
          s=s.replace(",prov,s2,flags=re.S)",",lambda _m:prov,s2,flags=re.S)")
          p.write_text(s)
          PY
      - name: Apply reliability patch v2
        run: python scripts/patch_telegram_time_support_v2.py
      - name: Validate syntax and trust cases
        run: |
          node --check api/aggregate.js
          node --check public/app.js
          node --check public/tgatlas-ui.js
          node --input-type=module <<'NODE'
          import { applyTelegramTimeTrust } from './api/aggregate.js';
          const t=(o)=>({source:'telegram',ageMin:10,...o});
          const numeric=applyTelegramTimeTrust({waitMin:100,sources:[t({value:90})]});
          const supportedLow=applyTelegramTimeTrust({waitMin:10,sources:[t({queueCars:1,note:'без черги'}),t({queueCars:2,note:'вільно'})]});
          const supportedHigh=applyTelegramTimeTrust({waitMin:90,sources:[t({queueCars:18,note:'черга'}),t({queueCars:25,note:'стоїмо'})]});
          const conflict=applyTelegramTimeTrust({waitMin:10,sources:[t({queueCars:30,note:'велика черга'})]});
          const missing=applyTelegramTimeTrust({waitMin:50,sources:[]});
          if(!numeric.timeReliable || numeric.timeReliability!=='confirmed') throw new Error('numeric confirm failed');
          if(!supportedLow.timeReliable || supportedLow.timeReliability!=='supported') throw new Error('low support failed');
          if(!supportedHigh.timeReliable || supportedHigh.timeReliability!=='supported') throw new Error('high support failed');
          if(conflict.timeReliable || conflict.timeReliability!=='conflict') throw new Error('qualitative conflict failed');
          if(missing.timeReliable || missing.timeReliability!=='unconfirmed') throw new Error('missing failed');
          console.log(JSON.stringify({numeric,supportedLow,supportedHigh,conflict,missing}));
          NODE
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/aggregate.js public/app.js scripts/patch_telegram_time_support_v2.py
          git commit -m "Support reliable times with qualitative Telegram evidence"
          git push origin HEAD:border-monitor
