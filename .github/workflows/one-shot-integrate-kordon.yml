name: One-shot integrate Kordon DPSU queues

on:
  push:
    branches: [border-monitor]
    paths:
      - .github/workflows/one-shot-integrate-kordon.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wire Kordon into aggregation and UI
        env:
          HELPER_B64: 
          HANDLER_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          helper=base64.b64decode(os.environ['HELPER_B64']).decode()
          handler=base64.b64decode(os.environ['HANDLER_B64']).decode()
          p=Path('api/aggregate.js'); s=p.read_text()
          imp="import {fetchNakordoniWeb} from './nakordoni-web.js';"
          if "from './kordon-live.js'" not in s:
              if imp not in s: raise SystemExit('aggregate import marker missing')
              s=s.replace(imp,imp+"\nimport {fetchKordonLive} from './kordon-live.js';",1)
          marker='async function supplementNakordoniWeb(rows,direction){'
          if 'function mergeKordon(' not in s:
              if marker not in s: raise SystemExit('aggregate supplement marker missing')
              s=s.replace(marker,helper+marker,1)
          start=s.find('export default async function handler(req,res){')
          if start<0: raise SystemExit('handler marker missing')
          p.write_text(s[:start]+handler)
          p=Path('server.source.js'); s=p.read_text()
          old="nakordoni:payload?.sourceStatus?.nakordoni,telegram:payload?.sourceStatus?.telegram"
          new="nakordoni:payload?.sourceStatus?.nakordoni,kordon:payload?.sourceStatus?.kordon,kordonCount:payload?.sourceStatus?.kordonDetails?.count,telegram:payload?.sourceStatus?.telegram"
          if old in s: s=s.replace(old,new,1)
          elif 'kordonCount:payload?.sourceStatus?.kordonDetails?.count' not in s: raise SystemExit('server diagnostic marker missing')
          p.write_text(s)
          p=Path('public/app.js'); s=p.read_text()
          old="const nk=data.sourceStatus?.nakordoni,tg=data.sourceStatus?.telegram,td=data.sourceStatus?.telegramDetails;$('sourceText').textContent=`Nakordoni: ${nk==='connected'?'✓':nk==='missing_key'?'немає ключа':nk||'—'} · Офіційні: ${officialSummary(data.sourceStatus?.official)} · Камери: ✓ · Telegram: ${telegramStatusLabel(tg,td)}`;render()"
          new="const nk=data.sourceStatus?.nakordoni,kd=data.sourceStatus?.kordon,kdd=data.sourceStatus?.kordonDetails,tg=data.sourceStatus?.telegram,td=data.sourceStatus?.telegramDetails;const kt=kd==='connected'?`✓${kdd?.count?` ${kdd.count}`:''}`:kd==='not_applicable'?'—':kd==='stale_cache'?'кеш':kd||'—';$('sourceText').textContent=`Nakordoni: ${nk==='connected'?'✓':nk==='missing_key'?'немає ключа':nk||'—'} · Kordon/ДПСУ: ${kt} · Офіційні: ${officialSummary(data.sourceStatus?.official)} · Камери: ✓ · Telegram: ${telegramStatusLabel(tg,td)}`;render()"
          if old in s: s=s.replace(old,new,1)
          elif 'Kordon/ДПСУ:' not in s: raise SystemExit('app source status marker missing')
          p.write_text(s)
          PY
          node --check api/kordon-live.js
          node --check api/aggregate.js
          node --check server.source.js
          node --check public/app.js
      - name: Verify live Kordon parser
        run: |
          node --input-type=module - <<'NODE'
          import {fetchKordonLive} from './api/kordon-live.js';
          const x=await fetchKordonLive('UA_EU');
          console.log(JSON.stringify({status:x.status,count:x.items?.length,ageMin:x.ageMin,items:(x.items||[]).map(i=>({name:i.name,queueCars:i.queueCars,evidence:i.evidence}))},null,2));
          if(x.status!=='connected'||!x.items?.some(i=>i.name==='Грушів - Будоміж'&&i.queueCars===0))process.exit(1);
          NODE
      - name: Build production bundle
        run: |
          npx --yes esbuild@0.25.10 server.source.js --bundle --platform=node --format=cjs --target=node20 --minify-whitespace --outfile=server.bundle.cjs
          printf "%s\n" "import './server.bundle.cjs';" > server.js
          node --check server.js
          node --check server.bundle.cjs
      - name: Commit integration and remove one-shot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-integrate-kordon.yml
          git add api/aggregate.js api/kordon-live.js server.source.js server.bundle.cjs server.js public/app.js
          git commit -m "Use Kordon DPSU queues as Poland fallback"
          git push origin HEAD:border-monitor
