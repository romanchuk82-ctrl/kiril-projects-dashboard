name: Verify Poland country-first production
on:
  push:
    branches: [border-monitor]
    paths: ['.github/workflows/verify-poland-telegram-v4-production.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Poland country view
        shell: bash
        run: |
          set -euo pipefail
          base='https://border-monitor-ua.onrender.com'
          curl -fsS --max-time 30 "$base/health" | jq -e '.ok==true' >/dev/null
          curl -fsS --max-time 30 "$base/app.js" -o /tmp/app.js
          grep -q 'function comparisonFor' /tmp/app.js
          grep -q 'Найшвидше за наявними даними' /tmp/app.js
          grep -q 'Найменша черга зараз' /tmp/app.js
          grep -q 'TOP-3 за чергою' /tmp/app.js
          grep -q "state.country === 'ALL'" /tmp/app.js
          grep -q 'i += 3' /tmp/app.js

          chats=(Krakivets shegunimeduka rawahrebenne ustylug ugryniv hryshiv yagodyn smilnutsa nyzhankovychi)
          for chat in "${chats[@]}"; do
            curl -fsS --max-time 70 "$base/snapshot?username=$chat&refresh=1" -o "/tmp/$chat.json"
            jq -e --arg c "$chat" 'any(.sources[]; ((.channel|ascii_downcase)==($c|ascii_downcase)) and .status=="connected")' "/tmp/$chat.json" >/dev/null
          done

          for dir in UA_EU EU_UA; do
            curl -fsS --max-time 90 "$base/api/aggregate?direction=$dir" -o "/tmp/$dir.json"
            echo "POLAND_$dir"
            jq -c --arg dir "$dir" '{direction:$dir,rows:([.crossings[]|select(.countryCode=="PL")]|length),telegramRows:([.crossings[]|select(.countryCode=="PL" and ([.sources[]?|select(.source=="telegram")]|length)>0)]|length),telegramMessages:([.crossings[]|select(.countryCode=="PL")|.sources[]?|select(.source=="telegram")]|length),withDisplayTime:([.crossings[]|select(.countryCode=="PL" and (.waitMin!=null or .telegramWaitMin!=null))]|length),withQueue:([.crossings[]|select(.countryCode=="PL" and (.queueCars!=null or .telegramQueueCars!=null))]|length)}' "/tmp/$dir.json"
            echo "BEST_TIME_$dir"
            jq -c '[.crossings[]|select(.countryCode=="PL")|. + {displayTime:(if .waitMin!=null then .waitMin elif .telegramWaitMin!=null then .telegramWaitMin else null end)}|select(.displayTime!=null)]|sort_by(.displayTime)|.[0]|{name,displayTime,timeReliability,timeReliable}' "/tmp/$dir.json"
            echo "BEST_QUEUE_$dir"
            jq -c '[.crossings[]|select(.countryCode=="PL")|. + {displayQueue:(if .queueCars!=null then .queueCars elif .telegramQueueCars!=null then .telegramQueueCars else null end)}|select(.displayQueue!=null)]|sort_by(.displayQueue)|.[0]|{name,displayQueue}' "/tmp/$dir.json"
          done

          jq -e '[.crossings[]|select(.countryCode=="PL" and (.waitMin!=null or .telegramWaitMin!=null))]|length<2 and [.crossings[]|select(.countryCode=="PL" and (.queueCars!=null or .telegramQueueCars!=null))]|length>=2' /tmp/UA_EU.json >/dev/null
          jq -e '[.crossings[]|select((((.telegramChat.channel // "")|ascii_downcase)=="hryshiv"))]|length==1' /tmp/EU_UA.json >/dev/null
