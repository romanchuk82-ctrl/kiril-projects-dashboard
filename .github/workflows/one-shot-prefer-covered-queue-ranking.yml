name: One-shot prefer covered queue ranking

on:
  push:
    branches: [border-monitor]
    paths:
      - .github/workflows/one-shot-prefer-covered-queue-ranking.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch ranking selection
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('public/app.js'); s=p.read_text()
          old=base64.b64decode(os.environ['OLD_B64']).decode()
          new=base64.b64decode(os.environ['NEW_B64']).decode()
          if old not in s: raise SystemExit('comparisonFor marker missing')
          s=s.replace(old,new,1)
          s=s.replace('Порівняння за кількістю авто та прямими свіжими повідомленнями «без черги».','Рейтинг за найширшим набором свіжих підтверджених даних: кількість авто та прямі повідомлення «без черги».',1)
          p.write_text(s)
          PY
          node --check public/app.js
          grep -q 'queueHasBetterCoverage' public/app.js
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-prefer-covered-queue-ranking.yml
          git add public/app.js
          git commit -m "Prefer queue ranking when coverage is stronger"
          git push origin HEAD:border-monitor
