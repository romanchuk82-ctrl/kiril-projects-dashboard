name: One-shot Border Monitor ranking trust fix

on:
  push:
    branches: [border-monitor]
    paths:
      - .github/workflows/one-shot-border-ranking-trust-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make incomplete ranking explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/app.js')
          s = p.read_text()

          old = "const raw=currentRows(),cmp=comparisonFor(raw),queueMode=cmp.mode==='queue'||cmp.mode==='queue_single';"
          new = "const raw=currentRows(),cmp=comparisonFor(raw),queueMode=cmp.mode==='queue'||cmp.mode==='queue_single';const activeRows=raw.filter(r=>!r.stale),knownRows=activeRows.filter(r=>queueMode?queueRankValue(r)!=null:displayTimeMin(r)!=null),unknownRows=activeRows.filter(r=>queueMode?queueRankValue(r)==null:displayTimeMin(r)==null),rankingIncomplete=unknownRows.length>0,unknownNames=unknownRows.slice().sort((a,b)=>(displayAgeMin(a)??99999)-(displayAgeMin(b)??99999)).slice(0,4).map(r=>r.name);"
          if old not in s: raise SystemExit('render coverage marker missing')
          s = s.replace(old, new, 1)

          old = "const labels=document.querySelectorAll('.summary-card .summary-label');if(labels[0])labels[0].textContent=queueMode?'TOP-3 за чергою':'TOP-3 за часом';if(labels[1])labels[1].textContent=queueMode?'Найбільша черга':'Найдовший час';"
          new = "const labels=document.querySelectorAll('.summary-card .summary-label');if(labels[0])labels[0].textContent=queueMode?(rankingIncomplete?`Підтверджені черги (${knownRows.length}/${activeRows.length})`:'TOP-3 за чергою'):'TOP-3 за часом';if(labels[1])labels[1].textContent=queueMode?(rankingIncomplete?'Найбільша підтверджена':'Найбільша черга'):'Найдовший час';"
          if old not in s: raise SystemExit('summary label marker missing')
          s = s.replace(old, new, 1)

          old = "else if(cmp.mode==='queue')$('heroCard').innerHTML=`<div class=\"hero-kicker\">Найменша черга зараз</div><div class=\"hero-main\"><div><div class=\"hero-name\">${flag(best.countryCode)} ${esc(best.name)}</div><div class=\"hero-meta\">${esc(best.country)} · ${fmtAge(displayAgeMin(best))}</div></div><div class=\"hero-wait\">${queueRankText(best)}</div></div><div class=\"hero-note\">Порівняння за кількістю авто та прямими свіжими повідомленнями «без черги». Точного часу по більшості КПП поки немає.</div>`;"
          new = "else if(cmp.mode==='queue')$('heroCard').innerHTML=`<div class=\"hero-kicker\">${rankingIncomplete?'Найменша підтверджена черга':'Найменша черга зараз'}</div><div class=\"hero-main\"><div><div class=\"hero-name\">${flag(best.countryCode)} ${esc(best.name)}</div><div class=\"hero-meta\">${esc(best.country)} · ${fmtAge(displayAgeMin(best))}</div></div><div class=\"hero-wait\">${queueRankText(best)}</div></div><div class=\"hero-note\">${rankingIncomplete?`⚠️ Це не рейтинг усіх КПП. Числові/прямі дані є лише по ${knownRows.length} з ${activeRows.length}. Без достатніх даних: ${esc(unknownNames.join(', '))}${unknownRows.length>unknownNames.length?' та інші':''}. Вони можуть бути швидшими.`:'Порівняння за кількістю авто та прямими свіжими повідомленнями «без черги».'}</div>`;"
          if old not in s: raise SystemExit('queue hero marker missing')
          s = s.replace(old, new, 1)

          old = "else if(cmp.mode==='queue_single')$('heroCard').innerHTML=`<div class=\"hero-kicker\">Є дані про чергу по одному КПП</div><div class=\"hero-main\"><div><div class=\"hero-name\">${flag(best.countryCode)} ${esc(best.name)}</div><div class=\"hero-meta\">${esc(best.country)} · ${fmtAge(displayAgeMin(best))}</div></div><div class=\"hero-wait\">${queueRankText(best)}</div></div><div class=\"hero-note\">Порівняти з іншими КПП поки неможливо.</div>`;"
          new = "else if(cmp.mode==='queue_single')$('heroCard').innerHTML=`<div class=\"hero-kicker\">Є підтверджена черга лише по одному КПП</div><div class=\"hero-main\"><div><div class=\"hero-name\">${flag(best.countryCode)} ${esc(best.name)}</div><div class=\"hero-meta\">${esc(best.country)} · ${fmtAge(displayAgeMin(best))}</div></div><div class=\"hero-wait\">${queueRankText(best)}</div></div><div class=\"hero-note\">⚠️ Це не означає, що цей КПП найшвидший. По інших переходах бракує числових даних.</div>`;"
          if old in s: s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          node --check public/app.js
          grep -q "Це не рейтинг усіх КПП" public/app.js
          grep -q "Підтверджені черги" public/app.js
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-border-ranking-trust-fix.yml
          git add public/app.js
          git commit -m "Make incomplete border ranking explicit"
          git push origin HEAD:border-monitor
