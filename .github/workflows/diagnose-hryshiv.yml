name: Diagnose Hryshiv Telegram

# Inspect raw recent messages after parser fix 2026-09-27
on:
  push:
    branches: [border-monitor]
    paths:
      - '.github/workflows/diagnose-hryshiv.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live Hryshiv snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://border-monitor-ua.onrender.com/api/telegram?username=hryshiv&refresh=1' -o /tmp/hryshiv.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/hryshiv.json','utf8'));
          const src=(x.sources||[]).find(s=>String(s.channel||'').toLowerCase()==='hryshiv')||{};
          const items=(x.items||[]).filter(i=>String(i.source_channel||'').toLowerCase()==='hryshiv');
          console.log(JSON.stringify({generatedAt:x.generatedAt,status:x.status,source:{status:src.status,messagesScanned:src.messagesScanned,newestMessageAt:src.newestMessageAt,items:src.items,error:src.error},recentMessages:(x.recentMessages||[]).slice(0,20),items:items.map(i=>({id:i.message_id,updated_at:i.updated_at,age_min:i.age_min,direction:i.direction,wait_min:i.wait_min,queue_cars:i.queue_cars,note:i.note,reply_context:i.reply_context,direction_basis:i.direction_basis,source_url:i.source_url}))},null,2));
          NODE
