name: Apply Telegram duplicate placeholder fix
on:
  push:
    branches: [border-monitor]
    paths: ['.github/workflows/apply-telegram-duplicate-placeholder-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - name: Apply duplicate fix v3
        run: python scripts/fix_telegram_duplicate_placeholders.py
      - name: Validate
        run: |
          node --check api/aggregate.js
          node --input-type=module <<'NODE'
          import {mergeTelegram} from './api/aggregate.js';
          const rows=[
            {id:'official-hryshiv',name:'Грушів - Будомєж',countryCode:'PL',direction:'EU_UA',waitMin:0,sources:[{source:'official_pl',value:0}]},
            {id:'tg-chat-hryshiv-EU_UA',name:'Грушів - Будоміж',countryCode:'PL',direction:'EU_UA',waitMin:null,sources:[],telegramChat:{channel:'hryshiv'},humanReports:0}
          ];
          const chats=[{kind:'checkpoint_chat',checkpoint:'Грушів - Будоміж',countryCode:'PL',channel:'hryshiv',label:'Грушів - Будоміж',channelUrl:'https://t.me/hryshiv',status:'connected',aliases:['грушів','будомєж','будоміж']}];
          const items=[{checkpoint:'Грушів - Будоміж',country_code:'PL',direction:'EU_UA',queue_cars:30,age_min:20,updated_at:new Date().toISOString(),source_channel:'hryshiv',source_label:'Грушів - Будоміж',channel_url:'https://t.me/hryshiv',note:'30 авто в Україну'}];
          const out=mergeTelegram(rows,items,'EU_UA',chats);
          const same=out.filter(x=>String(x.telegramChat?.channel||'').toLowerCase()==='hryshiv');
          if(same.length!==1) throw new Error('placeholder duplicate remains');
          if(same[0].humanReports!==1) throw new Error('human report not attached');
          console.log(JSON.stringify(same[0]));
          NODE
      - name: Commit changes safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/aggregate.js
          git commit -m "Remove duplicate Telegram placeholder rows"
          git pull --rebase origin border-monitor
          git push origin HEAD:border-monitor
