name: Probe Kordon all-borders link
on:
  push:
    branches: [border-monitor]
    paths: [.github/workflows/probe-kordon-all-link.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: border-monitor, fetch-depth: 0}
      - name: Find link and queue markup
        run: |
          curl -LfsS --max-time 30 -A 'Mozilla/5.0' 'https://kordon.info/?_bm='$(date +%s) -o /tmp/k.html
          python - <<'PY'
          from pathlib import Path
          import re,html
          s=Path('/tmp/k.html').read_text(errors='ignore')
          for needle in ['Всі кордони','kbq-','Грушів - Будом','Шегині - Медика']:
            print('\n###',needle)
            pos=0
            for _ in range(15):
              i=s.find(needle,pos)
              if i<0: break
              print(re.sub(r'\s+',' ',html.unescape(s[max(0,i-700):i+1200]))[:2000])
              pos=i+len(needle)
          PY
      - name: Remove probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/probe-kordon-all-link.yml
          git commit -m 'Remove Kordon all-link probe'
          git push origin HEAD:border-monitor
