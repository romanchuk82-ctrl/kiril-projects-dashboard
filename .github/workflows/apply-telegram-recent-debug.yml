name: Apply Telegram recent-message diagnostic

on:
  push:
    branches: [border-monitor]
    paths:
      - 'scripts/patch_telegram_recent_debug.py'
      - '.github/workflows/apply-telegram-recent-debug.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: python scripts/patch_telegram_recent_debug.py
      - run: |
          node --check api/telegram.js
          npm test
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/telegram.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expose recent Telegram messages in per-source diagnostics"
          git pull --rebase origin border-monitor
          git push origin HEAD:border-monitor
