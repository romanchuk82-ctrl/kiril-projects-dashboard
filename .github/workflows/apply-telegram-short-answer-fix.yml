name: Apply Telegram short-answer parser fix

on:
  push:
    branches:
      - border-monitor
    paths:
      - '.github/workflows/apply-telegram-short-answer-fix.yml'
      - 'scripts/fix_telegram_short_answers.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - name: Apply parser fix
        run: python scripts/fix_telegram_short_answers.py
      - name: Syntax check
        run: |
          node --check api/telegram.js
          node --check public/app.js
      - name: Commit generated changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/telegram.js public/app.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Telegram short answers and latest message selection"
          git pull --rebase origin border-monitor
          git push origin HEAD:border-monitor
