name: Apply Telegram short queue reply fix

on:
  push:
    branches: [border-monitor]
    paths:
      - 'scripts/patch_telegram_short_queue_reply.py'
      - '.github/workflows/apply-telegram-short-queue-reply.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply exact Hryshiv parser fix
        run: python scripts/patch_telegram_short_queue_reply.py
      - name: Verify tests
        run: |
          node --check api/telegram.js
          node --check api/aggregate.js
          npm test
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/telegram.js api/aggregate.js test/telegram.test.js test/aggregate.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Parse short no-queue Telegram replies"
          git pull --rebase origin border-monitor
          git push origin HEAD:border-monitor
