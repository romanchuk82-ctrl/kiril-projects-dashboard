name: One-shot Telegram cache TTL

'on':
  push:
    branches:
      - border-monitor
    paths:
      - .github/workflows/one-shot-telegram-cache-ttl.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reduce Telegram cache TTL and rebuild
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/telegram.js')
          s=p.read_text()
          old='const SOURCE_TTL_MS = 30 * 60 * 1000;'
          new='const SOURCE_TTL_MS = 3 * 60 * 1000;'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('SOURCE_TTL_MS marker missing')
          p.write_text(s)
          PY
          node --check api/telegram.js
          npx --yes esbuild@0.25.10 server.source.js --bundle --platform=node --format=cjs --target=node20 --minify-whitespace --outfile=server.bundle.cjs
          printf "%s\n" "import './server.bundle.cjs';" > server.js
          node --check server.js
          node --check server.bundle.cjs
      - name: Commit rebuilt runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-telegram-cache-ttl.yml
          git add api/telegram.js server.bundle.cjs server.js
          git commit -m 'Refresh Telegram source cache every 3 minutes'
          git push origin HEAD:border-monitor
