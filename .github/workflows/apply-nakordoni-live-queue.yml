name: Apply Nakordoni live queue refresh

on:
  push:
    branches: [border-monitor]
    paths:
      - 'scripts/patch_nakordoni_live_queue.py'
      - '.github/workflows/apply-nakordoni-live-queue.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_nakordoni_live_queue.py
      - name: Verify syntax and tests
        run: |
          node --check api/aggregate.js
          npm test
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/aggregate.js test/aggregate.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh stale Nakordoni checkpoints via Live Queue API"
          git pull --rebase origin border-monitor
          git push origin HEAD:border-monitor
