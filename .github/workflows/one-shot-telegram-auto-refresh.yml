name: One-shot Telegram auto refresh

'on':
  push:
    branches:
      - border-monitor
    paths:
      - .github/workflows/one-shot-telegram-auto-refresh.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - name: Apply Telegram live UX patch
        env:
          PATCH_B64: ''
        run: |
          python - <<'PY'
          import base64, os
          exec(base64.b64decode(os.environ['PATCH_B64']).decode())
          PY
          node --check public/app.js
          grep -q 'setInterval(load,60_000)' public/app.js
          grep -q 'Останнє актуальне повідомлення Telegram' public/app.js
          test -z "$(grep -n 'refreshBtn' public/app.js || true)"
          test -z "$(grep -n 'refreshBtn' public/index.html || true)"
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-telegram-auto-refresh.yml
          git add public/app.js public/index.html
          git commit -m 'Auto-refresh Telegram and show latest relevant message'
          git push origin HEAD:border-monitor
