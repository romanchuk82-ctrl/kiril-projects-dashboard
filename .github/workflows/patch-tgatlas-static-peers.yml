name: Patch tgAtlas static peer IDs

on:
  push:
    branches: [border-monitor]
    paths:
      - '.github/workflows/patch-tgatlas-static-peers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - name: Embed stable Telegram peer IDs
        run: python scripts/patch_static_peers.py
      - name: Validate and commit
        run: |
          node --check api/telegram.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/telegram.js
          git commit -m "Use stable peer IDs for tgAtlas history"
          git push origin HEAD:border-monitor
