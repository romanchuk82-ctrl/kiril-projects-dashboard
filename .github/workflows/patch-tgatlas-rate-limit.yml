name: Patch tgAtlas rate limit

on:
  push:
    branches: [border-monitor]
    paths:
      - '.github/workflows/patch-tgatlas-rate-limit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_tgatlas_rate.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/telegram.js public/app.js public/styles.css
          git commit -m "Harden tgAtlas rate limiting and polish Telegram UI"
          git push origin HEAD:border-monitor
