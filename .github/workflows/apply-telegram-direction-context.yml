name: Apply Telegram direction context fix

on:
  push:
    branches: [border-monitor]
    paths:
      - 'scripts/patch_telegram_direction_context.py'
      - '.github/workflows/apply-telegram-direction-context.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: border-monitor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python scripts/patch_telegram_direction_context.py
      - name: Verify
        run: |
          node --check api/telegram.js
          npm test
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/telegram.js test/telegram.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use older direction context for strong Telegram queue signals"
          git pull --rebase origin border-monitor
          git push origin HEAD:border-monitor
